name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Lint
        shell: pwsh
        run: ./scripts/lint.ps1

      - name: Check go.mod is tidy
        shell: pwsh
        run: |
          go mod tidy
          $diff = git diff --name-only go.mod go.sum
          if ($diff) {
            Write-Host "ERROR: go.mod or go.sum is not tidy. Run 'go mod tidy' and commit."
            git diff go.mod go.sum
            exit 1
          } else {
            Write-Host "go.mod is tidy"
          }

  build:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-windows-${{ github.sha }}
          path: mcp-server.exe
          compression-level: 0
          if-no-files-found: error
